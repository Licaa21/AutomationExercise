<nav class="navbar navbar-dark bg-dark px-4">
  <span class="navbar-brand fw-bold">Automation Exercise</span>
  <div class="d-flex gap-2 align-items-center">
    <div class="position-relative">
      <button class="btn btn-outline-light btn-sm" (click)="toggleCart()">
        Cart <span class="badge bg-primary">{{ cartItemCount }}</span>
      </button>
      @if (showCart) {
        <app-cart (closeCart)="toggleCart()" (proceedToCheckout)="onProceedToCheckout()"></app-cart>
      }
    </div>
    @if (auth.isLoggedIn()) {
      <button class="btn btn-danger btn-sm" (click)="logout()">Logout</button>
    } @else {
      <button class="btn btn-primary btn-sm" (click)="showLogin=true">Login</button>
    }
  </div>
</nav>

<div class="container mt-4">
  @if (showLogin) {
    <app-login (loginSuccess)="onLoginSuccess()" (goToRegister)="onGotoRegister()" (close)="showLogin=false"></app-login>
  }
  @if (showRegister) {
    <app-register (goToLogin)="onGotoLogin()" (close)="showRegister=false"></app-register>
  }
@if (showCheckout) {
    <app-checkout (closeCheckout)="toggleCart()" (orderPlaced)="onOrderPlaced()"></app-checkout>
  }
  <app-product-list (requestLogin)="onRequestLogin()" (itemAdded)="showCart=true"></app-product-list>
</div>
