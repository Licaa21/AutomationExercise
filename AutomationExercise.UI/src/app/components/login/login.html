<div class="login-backdrop" (click)="close.emit()">
  <div class="login-card" (click)="$event.stopPropagation()">
    <div class="modal-header-bar">
      <h5 class="mb-0">Login</h5>
      <button type="button" class="btn-close btn-close-white" (click)="close.emit()"></button>
    </div>
    <div class="p-4">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" class="form-control" [(ngModel)]="username" placeholder="Enter your username" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" placeholder="Enter your password" />
      </div>
      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }
      <button class="btn btn-primary w-100 mb-2" (click)="login()">Login</button>
      <button class="btn btn-link w-100" (click)="goToRegister.emit()">Don't have an account? Register</button>
    </div>
  </div>
</div>
