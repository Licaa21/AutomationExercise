<div class="cart-dropdown">
  <div class="cart-dropdown-header">
    <span class="fw-bold">Your Cart</span>
    <button type="button" class="btn-close" (click)="closeCart.emit()"></button>
  </div>
  <div class="cart-dropdown-body">
    @if (cartItems.length === 0) {
      <p class="text-muted text-center py-3 mb-0">Your cart is empty.</p>
    } @else {
      <ul class="list-group list-group-flush mb-3">
        @for (item of cartItems; track item.productId) {
          <li class="list-group-item d-flex justify-content-between align-items-center px-0">
            <div>
              <strong>{{ item.name }}</strong>
              <small class="text-muted d-block">Qty: {{ item.quantity }} × ${{ item.price }}</small>
            </div>
            <div class="d-flex align-items-center gap-2">
              <span class="fw-bold text-success">${{ item.price * item.quantity | number:'1.2-2' }}</span>
              <button class="btn btn-outline-danger btn-sm" (click)="removeItem(item.productId)">✕</button>
            </div>
          </li>
        }
      </ul>
      <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <span class="fw-bold">Total: <span class="text-success">${{ total | number:'1.2-2' }}</span></span>
        <button class="btn btn-primary btn-sm" (click)="proceedToCheckout.emit()">Checkout →</button>
      </div>
    }
  </div>
</div>
