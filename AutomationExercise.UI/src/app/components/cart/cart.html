<div class="cart-dropdown">
  <div class="cart-dropdown-header">
    <span class="fw-bold">Your Cart</span>
    <button type="button" class="btn-close btn-close-white" (click)="closeCart.emit()"></button>
  </div>
  <div class="cart-dropdown-body">
    @if (cartItems.length === 0) {
      <p class="text-muted text-center py-3 mb-0">Your cart is empty.</p>
    } @else {
      <ul class="list-group list-group-flush mb-3">
        @for (item of cartItems; track item.productId) {
          <li class="list-group-item d-flex justify-content-between align-items-center px-0 gap-2">
            <img [src]="item.imageUrl" alt="{{ item.name }}" class="cart-item-img">
            <div class="flex-grow-1">
              <strong>{{ item.name }}</strong>
              <small class="text-muted d-block">${{ item.price }} each</small>
            </div>
            <div class="d-flex align-items-center gap-1">
              <button class="btn btn-outline-secondary btn-sm px-2 py-0" (click)="decrement(item.productId)">−</button>
              <span class="mx-1 fw-bold">{{ item.quantity }}</span>
              <button class="btn btn-outline-secondary btn-sm px-2 py-0" (click)="increment(item.productId)">+</button>
              <span class="fw-bold text-success ms-2">${{ item.price * item.quantity | number:'1.2-2' }}</span>
              <button class="btn btn-outline-danger btn-sm px-2 py-0" (click)="removeItem(item.productId)">✕</button>
            </div>
          </li>
        }
      </ul>
      <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <span class="fw-bold">Total: <span class="text-success">${{ total | number:'1.2-2' }}</span></span>
        <button class="btn btn-primary btn-sm" (click)="proceedToCheckout.emit()">Checkout →</button>
      </div>
    }
  </div>
</div>
